name: Build

# 触发策略（DESIGN §9）：
#   - push/PR：analyze + test（轻量门禁）
#   - tag v*：analyze + test + release APK + 附件到 GitHub Release
#   - workflow_dispatch：手动全量（含 APK 构建）
# tag 推送时用 GITHUB_TOKEN 创建 Release —— 需显式授予写权限（默认只读会 403
# "Resource not accessible by integration"，WP-9 实测）。
permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7 # 锁定 stable（DESIGN §2.1；升级须同步本文件与 README）

jobs:
  test:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: dart run tool/ui_lint.dart
      - run: flutter test
      # 内嵌引擎（native/tailnet）编译门禁：宿主构建 + probe 可编译（不联网、不起节点）
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: native/tailnet/go.sum
      - run: go build ./...
        working-directory: native/tailnet

  apk:
    name: build release APK
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 注意：secrets 不能直接用于 if 条件（工作流校验失败）——经 job 级 env 中转。
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # 内嵌 tailnet 引擎：Go + NDK → jniLibs（release 只出 arm64-v8a）
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: native/tailnet/go.sum
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28
          add-to-path: false
      - name: Build embedded engine (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./scripts/build-native.sh arm64-v8a

      # 签名：仓库 Secrets 存在则用之；缺席则回落 debug 签名（仅用于内部验证，勿分发）。
      - name: Configure signing
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/quartz-release.jks
          cat > android/key.properties <<EOF
          storeFile=quartz-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: quartzwrt-app-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
